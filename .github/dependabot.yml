version: 2
updates:
  # The mcp>=1.9 breakage — a major release renaming FastMCP, landing silently
  # in an unpinned range — is exactly what this catches, two months earlier.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
