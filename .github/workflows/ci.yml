name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      # Lint only, not `ruff format --check`: adopting the formatter would
      # rewrite most of the codebase in one go and bury real changes in
      # reflow. Worth doing deliberately, not as a side effect of adding CI.
      - name: Ruff
        run: python -m ruff check lethe tests
      - name: Mypy
        run: python -m mypy lethe

  # Exactly what `pip install lethe-delete` gives a user: no extras, no dev
  # dependencies. v0.3.0 shipped with the documented verification API
  # (lethe.cert_schema) unimportable this way, because jsonschema was declared
  # only under an extra. No unit test could catch it — the dev environment
  # always has the extras installed, so the import always succeeded there.
  base-install:
    name: Base install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with no extras
        run: python -m pip install .

      - name: Documented public API must import
        # Run from outside the checkout, so Python imports the INSTALLED
        # package rather than the source tree — importing from the tree would
        # succeed regardless of what the wheel declares, and mask the bug.
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib

          # Everything a user can reach without opting into an extra.
          # lethe.mcp and lethe.anchor are deliberately absent: they require
          # the [mcp] and [anchor] extras by design.
          modules = [
              "lethe",
              "lethe.core",
              "lethe.certificate",
              "lethe.cert_schema",
              "lethe.signing",
              "lethe.ledger",
              "lethe.audit",
              "lethe.guard",
              "lethe.hashing",
              "lethe.models",
              "lethe.cli",
              "lethe.connectors.base",
              "lethe.connectors.pgvector",
              "lethe.connectors.pinecone",
              "lethe.integrations.langchain",
          ]
          for name in modules:
              importlib.import_module(name)
              print("ok", name)
          PY

      - name: Certificate verification must work end to end
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import hashlib
          from lethe.cert_schema import verify_certificate_json
          from lethe.certificate import build_certificate, canonical_payload_bytes, certificate_to_dict
          from lethe.models import LayerResult
          from lethe.signing import Signer

          signer = Signer.generate()
          cert = certificate_to_dict(build_certificate(
              request_id="r", subject_hash="s",
              layers=[LayerResult("pgvector", "docs", 1, True, requested_count=1)],
              issued_at="2026-09-05T00:00:00+00:00", version="0.3.1", signer=signer,
          ))
          pub = signer.public_key_b64()
          assert verify_certificate_json(cert, trusted_public_key=pub)["valid"] is True
          cert["payload"]["records_deleted"] = 9999
          assert verify_certificate_json(cert, trusted_public_key=pub)["valid"] is False
          print("verification works on a base install")
          PY

      - name: CLI must run
        run: |
          cd "$RUNNER_TEMP"
          lethe --help > /dev/null
          lethe verify --help > /dev/null
          echo "CLI ok"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # The suite's DB tests run against a stock Postgres — PgVectorConnector
    # addresses rows by id column, so no pgvector extension is required.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lethe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        env:
          LETHE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lethe_test
        run: python -m pytest -q -ra --junitxml=junit.xml

      # A green check that silently skipped the DB half of the suite would
      # overstate what CI proved. Every test must actually run.
      - name: No tests were skipped
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("junit.xml").getroot().find("testsuite")
          skipped, tests = int(suite.get("skipped")), int(suite.get("tests"))
          print(f"{tests} tests, {skipped} skipped")
          if skipped:
              sys.exit(f"{skipped} test(s) skipped — CI must exercise the full suite.")
          PY
