name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      # Installed so mypy checks notary/ against the real starlette and x402
      # types. Without it, `ignore_missing_imports` turns every one of them
      # into Any and the job would agree with anything.
      - name: Install notary
        run: python -m pip install -e "./notary[dev]"
      # Lint only, not `ruff format --check`: adopting the formatter would
      # rewrite most of the codebase in one go and bury real changes in
      # reflow. Worth doing deliberately, not as a side effect of adding CI.
      # notary/ is a separate distribution, but it is in this repo and it
      # handles money. It was linted and typechecked by hand for three
      # releases, which is another way of saying nobody was checking: three
      # "ruff clean" claims went unchallenged because no job disagreed.
      - name: Ruff
        run: python -m ruff check lethe tests notary
      - name: Mypy
        run: python -m mypy lethe notary/lethe_notary

  # Exactly what `pip install lethe-delete` gives a user: no extras, no dev
  # dependencies. v0.3.0 shipped with the documented verification API
  # (lethe.cert_schema) unimportable this way, because jsonschema was declared
  # only under an extra. No unit test could catch it — the dev environment
  # always has the extras installed, so the import always succeeded there.
  base-install:
    name: Base install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with no extras
        run: python -m pip install .

      - name: Documented public API must import
        # Run from outside the checkout, so Python imports the INSTALLED
        # package rather than the source tree — importing from the tree would
        # succeed regardless of what the wheel declares, and mask the bug.
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib

          # Everything a user can reach without opting into an extra.
          # lethe.mcp and lethe.anchor are deliberately absent: they require
          # the [mcp] and [anchor] extras by design.
          modules = [
              "lethe",
              "lethe.core",
              "lethe.certificate",
              "lethe.cert_schema",
              "lethe.signing",
              "lethe.ledger",
              "lethe.audit",
              "lethe.guard",
              "lethe.hashing",
              "lethe.models",
              "lethe.cli",
              "lethe.connectors.base",
              "lethe.connectors.pgvector",
              "lethe.connectors.pinecone",
              "lethe.integrations.langchain",
          ]
          for name in modules:
              importlib.import_module(name)
              print("ok", name)
          PY

      - name: Certificate verification must work end to end
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import hashlib
          from lethe.cert_schema import verify_certificate_json
          from lethe.certificate import build_certificate, canonical_payload_bytes, certificate_to_dict
          from lethe.models import LayerResult
          from lethe.signing import Signer

          signer = Signer.generate()
          cert = certificate_to_dict(build_certificate(
              request_id="r", subject_hash="s",
              layers=[LayerResult("pgvector", "docs", 1, True, requested_count=1)],
              issued_at="2026-09-05T00:00:00+00:00", version="0.3.1", signer=signer,
          ))
          pub = signer.public_key_b64()
          assert verify_certificate_json(cert, trusted_public_key=pub)["valid"] is True
          cert["payload"]["records_deleted"] = 9999
          assert verify_certificate_json(cert, trusted_public_key=pub)["valid"] is False
          print("verification works on a base install")
          PY

      - name: CLI must run
        run: |
          cd "$RUNNER_TEMP"
          lethe --help > /dev/null
          lethe verify --help > /dev/null
          echo "CLI ok"

  # The notary's own base install. Same lesson as base-install above, one
  # layer down: `pip install lethe-notary` declared bare x402, which installs
  # cleanly, starts the service, and fails on the FIRST PAID REQUEST. Measured
  # on a clean venv: bare x402 raises ImportError from the EVM mechanism, and
  # x402[evm] without httpx fails preflight with "No module named 'httpx'".
  # No unit test could catch either: the dev environment had eth_account,
  # eth_utils and httpx pulled in transitively, so it always worked there.
  notary-install:
    name: Notary install (no dev extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with no extras
        run: |
          python -m pip install .
          python -m pip install ./notary

      - name: The paid path must import
        # From outside the checkout, so the INSTALLED distributions are what
        # gets imported rather than the source tree.
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib

          # Every module the notary reaches for while taking a payment. These
          # are imported lazily inside PaymentGate, so nothing surfaces a
          # missing extra until money is on the line.
          for name in [
              "lethe_notary.service",
              "lethe_notary.payments",
              "lethe_notary.cli",
              "x402",
              "x402.http",
              # The two that a bare install does NOT get. x402.http imports
              # fine without them, so listing it alone would prove nothing.
              "x402.mechanisms.evm.exact.register",
              "httpx",      # the facilitator client needs it to make the call
              "eth_utils",  # the EIP-55 payee check silently no-ops without it
          ]:
              importlib.import_module(name)
              print("ok", name)
          PY

      - name: A price must be quotable
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from lethe_notary.payments import PaymentConfig, PaymentGate

          config = PaymentConfig(
              pay_to="0x000000000000000000000000000000000000dead",
              price="$0.01", network="eip155:84532",
              facilitator_url="https://x402.org/facilitator",
          )
          # No network contacted: building the requirement object is pure
          # local work. The import step above is what proves the extras are
          # present; this proves the config the notary quotes from still
          # constructs against whatever x402 version resolved.
          print(PaymentGate(config).resource_config())
          PY

      - name: CLI must run
        run: |
          cd "$RUNNER_TEMP"
          lethe-notary --help > /dev/null
          lethe-notary serve --help > /dev/null
          echo "notary CLI ok"

      # The documented acceptance path. It imports httpx at module scope, so
      # this also fails if the [httpx] extra is ever dropped again.
      - name: The buyer script must run
        run: python notary/tools/pay.py --help > /dev/null

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # The suite's DB tests run against a stock Postgres — PgVectorConnector
    # addresses rows by id column, so no pgvector extension is required.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lethe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      # Installed after the root package so `lethe-delete>=0.7` resolves to the
      # editable checkout rather than being fetched from an index that has
      # never had it.
      - name: Install notary
        run: python -m pip install -e "./notary[dev]"

      - name: Test
        env:
          LETHE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lethe_test
        run: python -m pytest -q -ra --junitxml=junit.xml

      # Its own run, not a wider testpaths: notary depends on starlette and
      # x402, which lethe deliberately does not, and a bare `pytest` at the
      # root must stay runnable without them. rootdir resolves to notary/,
      # so notary/pytest.ini deselects the live-facilitator tests.
      - name: Test notary
        env:
          LETHE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lethe_test
        run: python -m pytest notary/tests -q -ra --junitxml=notary-junit.xml

      # A green check that silently skipped the DB half of the suite would
      # overstate what CI proved. Every test must actually run.
      - name: No tests were skipped
        if: always()
        run: |
          python - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET

          failed = False
          for name in ("junit.xml", "notary-junit.xml"):
              path = pathlib.Path(name)
              if not path.exists():
                  # A missing report means that pytest run never happened —
                  # which this guard must fail on, not skip over.
                  print(f"{name}: MISSING")
                  failed = True
                  continue
              suite = ET.parse(path).getroot().find("testsuite")
              skipped, tests = int(suite.get("skipped")), int(suite.get("tests"))
              print(f"{name}: {tests} tests, {skipped} skipped")
              if skipped:
                  print(f"  {skipped} test(s) skipped — CI must exercise the full suite.")
                  failed = True
          if failed:
              sys.exit(1)
          PY
