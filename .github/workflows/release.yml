name: Release

# Tagging is the deliberate act; this turns the tag into a published Release so
# the two can never drift (v0.2.0 was tagged and then never released).
on:
  push:
    tags: ["v*"]

# Least privilege, set per job: only `release` writes to the repo, and the
# job that holds a PyPI credential holds nothing else.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The tag is the release's identity. If it disagrees with the packaged
      # version, the artifact and its label describe different things — the
      # same drift that left test_version asserting 0.1.0 for two months after
      # the 0.2.0 release. Fail before anything is published.
      - name: Tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Read version.py directly rather than importing it: importing the
          # package pulls lethe/__init__.py -> core -> psycopg, which is not
          # installed on a bare runner. This step must not need the deps.
          pkg="$(python -c 'import re, pathlib; print(re.search(r"__version__\s*=\s*[\"\x27]([^\"\x27]+)", pathlib.Path("lethe/version.py").read_text()).group(1))')"
          echo "tag=$tag packaged=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match lethe/version.py ($pkg)"
            exit 1
          fi
          echo "VERSION=$pkg" >> "$GITHUB_ENV"

      # Notes come from the CHANGELOG so the release and the changelog cannot
      # tell different stories. A missing or still-unreleased section fails the
      # build rather than publishing an empty or contradictory release.
      - name: Extract release notes from CHANGELOG
        run: |
          python - <<'PY' > release-notes.md
          import os, pathlib, re, sys

          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, text, re.MULTILINE | re.DOTALL)
          if match is None:
              sys.exit(f"CHANGELOG.md has no section for [{version}]")

          heading = re.search(rf"^## \[{re.escape(version)}\][^\n]*", text, re.MULTILINE).group(0)
          if "unreleased" in heading.lower():
              sys.exit(
                  f"CHANGELOG.md still marks [{version}] unreleased; "
                  "finalise the section before tagging"
              )

          body = match.group(1).strip()
          if not body:
              sys.exit(f"CHANGELOG.md section for [{version}] is empty")
          print(body)
          PY
          echo "--- notes preview ---"
          head -20 release-notes.md

      # gh is preinstalled on GitHub runners and uses the built-in token. No
      # third-party action is used here deliberately: a release job holds
      # contents:write, and this project should not hand that to a
      # supply-chain dependency it does not need.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag

  # PyPI, from the same tag. Until this existed the two drifted badly: the
  # repo reached 0.7.1 while `pip install lethe-delete` still served 0.2.0
  # from July, whose [mcp] extra declares an unpinned `mcp>=1.9`, resolves
  # mcp 2.x, and then dies on `from mcp.server.fastmcp import FastMCP` —
  # the documented MCP install was broken for every user while being fixed
  # in the repo. It also left `pip install ./notary` unsatisfiable, because
  # lethe-notary requires lethe-delete>=0.7 and no such version was public.
  #
  # Runs AFTER the GitHub Release: that step is repeatable, a PyPI upload is
  # not. A version can never be re-uploaded, so it goes last, when everything
  # cheaper has already succeeded.
  pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # A job-level `permissions` block sets everything it does not list to
      # `none`, so `contents: read` has to be spelled out or actions/checkout
      # cannot fetch the repo (codeql.yml spells it out for the same reason).
      contents: read
      # Mints the short-lived PyPI token, and is the only write this job has.
      # It cannot push to the repo, and there is no long-lived secret to leak.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      # The release job checked lethe/version.py. This checks the artifact
      # actually built from it — the thing that gets uploaded and can never be
      # replaced. A wheel whose version disagrees with the tag would publish
      # under a name nobody can trace back to a commit.
      - name: Built artifacts must carry the tag's version
        run: |
          python - <<'PY'
          import os, pathlib, sys

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          names = sorted(p.name for p in pathlib.Path("dist").iterdir())
          print("built:", names)
          expected = {f"lethe_delete-{version}-py3-none-any.whl",
                      f"lethe_delete-{version}.tar.gz"}
          if set(names) != expected:
              sys.exit(f"dist/ is {names}, expected {sorted(expected)}")
          print(f"both artifacts carry {version}")
          PY
          python -m twine check dist/*

      # No third-party action, for the same reason the release job uses gh
      # directly: a publish step should not hand anything to a supply-chain
      # dependency it does not need. This is the whole Trusted Publishing
      # exchange — ask GitHub for an OIDC token, swap it at PyPI for a
      # short-lived upload token — and it happens inside ONE process, so the
      # credential never crosses a step boundary or reaches the environment.
      - name: Publish
        run: |
          python - <<'PY'
          import glob, json, os, subprocess, sys, urllib.error, urllib.request

          def post(url, payload=None, headers=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, headers=headers or {})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          oidc = post(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=pypi",
              headers={"Authorization": "bearer "
                       + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )["value"]

          try:
              token = post("https://pypi.org/_/oidc/mint-token", {"token": oidc},
                           {"Content-Type": "application/json"})["token"]
          except urllib.error.HTTPError as exc:
              sys.exit(
                  f"PyPI refused to mint an upload token ({exc.code}). The most "
                  f"likely cause is that no Trusted Publisher is configured for "
                  f"lethe-delete: add publisher bluetieroperations-create/lethe, "
                  f"workflow release.yml, environment blank, at "
                  f"https://pypi.org/manage/project/lethe-delete/settings/publishing/"
              )

          # Keep it out of the log even if twine echoes it back on an error.
          print(f"::add-mask::{token}")

          env = dict(os.environ, TWINE_USERNAME="__token__", TWINE_PASSWORD=token)
          # Not --skip-existing: on a tag build, a version that is already on
          # PyPI means something is wrong and should be loud, not shrugged off.
          raise SystemExit(subprocess.call(
              [sys.executable, "-m", "twine", "upload", *sorted(glob.glob("dist/*"))],
              env=env))
          PY
