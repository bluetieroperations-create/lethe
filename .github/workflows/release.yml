name: Release

# Tagging is the deliberate act; this turns the tag into a published Release so
# the two can never drift (v0.2.0 was tagged and then never released).
on:
  push:
    tags: ["v*"]

  # Retry a PyPI publish for a tag that already has its GitHub Release.
  # Without this the only retry is a fresh tag, because `gh release create`
  # refuses an existing release — so every failed upload burned a version
  # number. v0.7.2's first attempt failed at the credential step with the
  # GitHub Release already published; this is how it gets finished rather
  # than abandoned.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish to PyPI, e.g. v0.7.2. The GitHub Release is not touched."
        required: true
        type: string

# Least privilege, set per job: only `release` writes to the repo, and the
# job that holds a PyPI credential holds nothing else.
permissions:
  contents: read

jobs:
  # Tag pushes only. A workflow_dispatch is a PyPI retry for a tag whose
  # Release already exists, so recreating it would just fail.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The tag is the release's identity. If it disagrees with the packaged
      # version, the artifact and its label describe different things — the
      # same drift that left test_version asserting 0.1.0 for two months after
      # the 0.2.0 release. Fail before anything is published.
      - name: Tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Read version.py directly rather than importing it: importing the
          # package pulls lethe/__init__.py -> core -> psycopg, which is not
          # installed on a bare runner. This step must not need the deps.
          pkg="$(python -c 'import re, pathlib; print(re.search(r"__version__\s*=\s*[\"\x27]([^\"\x27]+)", pathlib.Path("lethe/version.py").read_text()).group(1))')"
          echo "tag=$tag packaged=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match lethe/version.py ($pkg)"
            exit 1
          fi
          echo "VERSION=$pkg" >> "$GITHUB_ENV"

      # Notes come from the CHANGELOG so the release and the changelog cannot
      # tell different stories. A missing or still-unreleased section fails the
      # build rather than publishing an empty or contradictory release.
      - name: Extract release notes from CHANGELOG
        run: |
          python - <<'PY' > release-notes.md
          import os, pathlib, re, sys

          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, text, re.MULTILINE | re.DOTALL)
          if match is None:
              sys.exit(f"CHANGELOG.md has no section for [{version}]")

          heading = re.search(rf"^## \[{re.escape(version)}\][^\n]*", text, re.MULTILINE).group(0)
          if "unreleased" in heading.lower():
              sys.exit(
                  f"CHANGELOG.md still marks [{version}] unreleased; "
                  "finalise the section before tagging"
              )

          body = match.group(1).strip()
          if not body:
              sys.exit(f"CHANGELOG.md section for [{version}] is empty")
          print(body)
          PY
          echo "--- notes preview ---"
          head -20 release-notes.md

      # gh is preinstalled on GitHub runners and uses the built-in token. No
      # third-party action is used here deliberately: a release job holds
      # contents:write, and this project should not hand that to a
      # supply-chain dependency it does not need.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag

  # PyPI, from the same tag. Until this existed the two drifted badly: the
  # repo reached 0.7.1 while `pip install lethe-delete` still served 0.2.0
  # from July, whose [mcp] extra declares an unpinned `mcp>=1.9`, resolves
  # mcp 2.x, and then dies on `from mcp.server.fastmcp import FastMCP` —
  # the documented MCP install was broken for every user while being fixed
  # in the repo. It also left `pip install ./notary` unsatisfiable, because
  # lethe-notary requires lethe-delete>=0.7 and no such version was public.
  #
  # Runs AFTER the GitHub Release: that step is repeatable, a PyPI upload is
  # not. A version can never be re-uploaded, so it goes last, when everything
  # cheaper has already succeeded.
  pypi:
    name: Publish to PyPI
    needs: release
    # `needs` on a skipped job skips this one too, so the dispatch path has to
    # say so explicitly. Success or skipped — never after a FAILED release,
    # which would mean the tag gate or the notes did not pass.
    #
    # !cancelled(), not always(): always() runs even when the workflow has been
    # cancelled, and cancelling is the one stop button there is on the only
    # step here that cannot be undone.
    if: >-
      !cancelled()
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    # On a tag push this is the tag; on a dispatch, GITHUB_REF_NAME is the
    # branch the workflow was launched from, so the input is what counts.
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    permissions:
      # A job-level `permissions` block sets everything it does not list to
      # `none`, so `contents: read` has to be spelled out or actions/checkout
      # cannot fetch the repo (codeql.yml spells it out for the same reason).
      contents: read
      # Mints the short-lived PyPI token, and is the only write this job has.
      # It cannot push to the repo, and there is no long-lived secret to leak.
      id-token: write
    steps:
      # A tag, always. Reject anything else before it reaches checkout: this
      # job holds the minting credential, and what it builds is what gets
      # published under that version forever.
      - name: The tag must look like a release tag
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) echo "publishing $RELEASE_TAG" ;;
            *) echo "::error::RELEASE_TAG='$RELEASE_TAG' is not a vN.N.N tag"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          # One source of truth with RELEASE_TAG above. Spelling the expression
          # out twice meant the job could build one tree and label it another
          # if the copies ever drifted, and the artifact check below would only
          # notice when the versions happened to differ.
          ref: ${{ env.RELEASE_TAG }}

      # Belt and braces on that: prove the working tree IS the tag before
      # anything is built from it. This also catches a `ref:` that silently
      # resolved to nothing, which checks out the default branch rather than
      # failing. Verified against all four cases, including a branch HEAD while
      # RELEASE_TAG named a tag.
      - name: The checkout must be at that tag
        run: |
          head="$(git rev-parse HEAD)"
          want="$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" || true)"
          if [ -z "$want" ]; then
            echo "::error::tag $RELEASE_TAG is not present after checkout"; exit 1
          fi
          if [ "$head" != "$want" ]; then
            echo "::error::HEAD is $head, but $RELEASE_TAG is $want - wrong tree checked out"
            exit 1
          fi
          echo "checked out $RELEASE_TAG ($head)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      # The release job checked lethe/version.py. This checks the artifact
      # actually built from it — the thing that gets uploaded and can never be
      # replaced. A wheel whose version disagrees with the tag would publish
      # under a name nobody can trace back to a commit.
      - name: Built artifacts must carry the tag's version
        run: |
          python - <<'PY'
          import os, pathlib, sys

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          names = sorted(p.name for p in pathlib.Path("dist").iterdir())
          print("built:", names)
          expected = {f"lethe_delete-{version}-py3-none-any.whl",
                      f"lethe_delete-{version}.tar.gz"}
          if set(names) != expected:
              sys.exit(f"dist/ is {names}, expected {sorted(expected)}")
          print(f"both artifacts carry {version}")
          PY
          python -m twine check dist/*

      # No third-party action, for the same reason the release job uses gh
      # directly: a publish step should not hand anything to a supply-chain
      # dependency it does not need. This is the whole Trusted Publishing
      # exchange — ask GitHub for an OIDC token, swap it at PyPI for a
      # short-lived upload token — and it happens inside ONE process, so the
      # credential never crosses a step boundary or reaches the environment.
      - name: Publish
        run: |
          python - <<'PY'
          import glob, json, os, subprocess, sys, urllib.error, urllib.request

          def post(url, payload=None, headers=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, headers=headers or {})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          oidc = post(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=pypi",
              headers={"Authorization": "bearer "
                       + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )["value"]

          try:
              token = post("https://pypi.org/_/oidc/mint-token", {"token": oidc},
                           {"Content-Type": "application/json"})["token"]
          except urllib.error.HTTPError as exc:
              # PRINT WHAT PYPI SAID. Its body names the claim that did not
              # match; the first version of this swallowed it and guessed, so a
              # 422 on v0.7.2 said "probably not configured" when a publisher
              # was configured and one field was wrong. One failed run should be
              # enough to know which field.
              body = exc.read().decode("utf-8", "replace").strip()[:2000]
              # 422 covers BOTH "no publishers at all" and "publishers, none
              # matching" — v0.7.2 failed with zero configured, so do not claim
              # one exists. Start by looking at the page.
              hint = (
                  "422 means no configured publisher matched this run — which "
                  "includes having none at all. Open the settings page below "
                  "and check: is a publisher listed? Then Workflow name must be "
                  "the FILENAME `release.yml`, not the display name `Release`; "
                  "Environment must be blank, because this job declares none; "
                  "Owner `bluetieroperations-create`, Repository `lethe`, bare "
                  "names with no URL or .git."
                  if exc.code == 422 else
                  "Check the publisher: owner bluetieroperations-create, "
                  "repository lethe, workflow release.yml, environment blank."
              )
              sys.exit(
                  f"PyPI refused to mint an upload token (HTTP {exc.code}).\n"
                  f"PyPI said: {body}\n\n{hint}\n"
                  f"Settings: https://pypi.org/manage/project/lethe-delete/settings/publishing/"
              )
          except urllib.error.URLError as exc:
              sys.exit(f"Could not reach PyPI to mint a token: {exc.reason}")

          # Keep it out of the log even if twine echoes it back on an error.
          print(f"::add-mask::{token}")

          env = dict(os.environ, TWINE_USERNAME="__token__", TWINE_PASSWORD=token)
          # Not --skip-existing: on a tag build, a version that is already on
          # PyPI means something is wrong and should be loud, not shrugged off.
          raise SystemExit(subprocess.call(
              [sys.executable, "-m", "twine", "upload", *sorted(glob.glob("dist/*"))],
              env=env))
          PY
