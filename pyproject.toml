[project]
name = "lethe"
version = "0.1.0"
description = "The forget button for AI — provable data-subject deletion for AI memory."
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["psycopg[binary]>=3.1", "cryptography>=42", "click>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.21", "mcp>=1.9"]
mcp = ["mcp>=1.9", "jsonschema>=4.21"]

[project.scripts]
lethe = "lethe.cli:cli"
lethe-mcp = "lethe.mcp:main"

[tool.setuptools.packages.find]
include = ["lethe*"]

[tool.setuptools.package-data]
lethe = ["schemas/*.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
