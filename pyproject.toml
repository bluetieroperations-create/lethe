[project]
# Distribution name (PyPI): "lethe" is taken (a lithography lib), so we ship as
# "lethe-delete". The import package stays `lethe` (pip install lethe-delete;
# import lethe) and the CLI commands stay `lethe` / `lethe-mcp`.
name = "lethe-delete"
dynamic = ["version"]
description = "The forget button for AI — provable data-subject deletion for AI memory, with signed deletion certificates."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["gdpr", "ccpa", "dsar", "right-to-be-forgotten", "deletion", "vector-database", "rag", "ai-memory", "mcp", "compliance"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
dependencies = [
    "psycopg[binary]>=3.1",
    "cryptography>=42",
    "click>=8.1",
    # Required, not optional: lethe/cert_schema.py imports it at module
    # level, and that module is the documented way to verify a certificate
    # programmatically. Shipping it as an extra made the published
    # verification API unimportable on a plain install.
    "jsonschema>=4.21",
]

[project.urls]
Repository = "https://github.com/bluetieroperations-create/lethe"
Documentation = "https://github.com/bluetieroperations-create/lethe/blob/main/docs/m2m.md"

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.21", "mcp>=2,<3", "ruff>=0.6", "mypy>=1.11", "asn1crypto>=1.5"]
mcp = ["mcp>=2,<3"]
# RFC 3161 external anchoring. Optional: Lethe runs without it, unanchored.
anchor = ["asn1crypto>=1.5"]

[project.scripts]
lethe = "lethe.cli:cli"
lethe-mcp = "lethe.mcp:main"

[tool.setuptools.dynamic]
version = {attr = "lethe.version.__version__"}

[tool.setuptools.packages.find]
include = ["lethe*"]

[tool.setuptools.package-data]
lethe = ["schemas/*.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# A focused set: correctness (E/F), import order (I), modern syntax (UP),
# likely-bug patterns (B), and comprehension/simplification hints (SIM/C4).
# Deliberately NOT enabled:
#   BLE001/S110 — Lethe catches broadly on purpose where ANY failure must read
#     as "verification failed" (signature checks, key decoding). Enforcing them
#     would require noqa at every security-critical catch, which is worse.
#   RUF059 — flags intentionally-unpacked-but-unused values in tests.
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
# Live tests are DESELECTED by default, not skipped: CI fails the build on any
# skipped test (a green run that silently skipped half the suite overstates
# what it proved), so a credential-gated test must not register as a skip.
# Run them with:  pytest -m live
markers = ["live: hits a real third-party service; needs credentials"]
addopts = "-m 'not live'"
# Only this package's tests. notary/ is a separate distribution with its own
# dependencies (starlette, x402) and its own pytest run; without this, a bare
# `pytest` at the repo root — which is what CI runs — would collect its tests
# and fail on imports that lethe deliberately does not have.
testpaths = ["tests"]
