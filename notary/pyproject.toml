[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lethe-notary"
version = "0.1.0"
description = "A paid countersigning witness for Lethe deletion certificates, billed over x402."
requires-python = ">=3.11"
dependencies = [
    "lethe-delete>=0.7",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "click>=8.1",
    "x402>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
lethe-notary = "lethe_notary.cli:cli"

[tool.setuptools.packages.find]
include = ["lethe_notary*"]
