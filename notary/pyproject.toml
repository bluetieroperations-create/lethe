[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lethe-notary"
version = "0.2.0"
description = "A paid countersigning witness for Lethe deletion certificates, billed over x402."
# Without this the PyPI page is blank — no description at all — and a
# published version's metadata can never be amended, only superseded.
readme = "README.md"
requires-python = ">=3.11"
keywords = ["x402", "gdpr", "ccpa", "deletion", "attestation", "notary",
            "audit", "compliance", "micropayments", "agent-payments"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
dependencies = [
    "lethe-delete>=0.7",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "click>=8.1",
    # [evm] and [httpx], not bare x402. Measured on a clean venv:
    #   bare x402      -> PaymentGate.server() raises ImportError,
    #                     "EVM mechanism requires ethereum packages"
    #   x402[evm] only -> preflight fails, "No module named 'httpx'"
    # Either way the notary installs cleanly, starts, and cannot take a
    # payment. Missing eth_utils (also under [evm]) additionally makes the
    # EIP-55 check on LETHE_NOTARY_PAY_TO silently accept a mistyped payee.
    "x402[evm,httpx]>=2,<3",
]

[project.urls]
Repository = "https://github.com/bluetieroperations-create/lethe"
Documentation = "https://github.com/bluetieroperations-create/lethe/blob/main/notary/README.md"

[project.optional-dependencies]
# httpx, not httpx2: starlette's TestClient imports `httpx`, and the
# distribution named httpx2 ships a module called `httpx2` instead. The
# tests passed anyway only because httpx arrives transitively; a clean
# install of this extra could not import TestClient at all.
# PyJWT is a TEST dependency only, never a runtime one: lethe_notary.cdp_auth
# mints its own JWS with `cryptography` (already required, via lethe-delete)
# so mainnet auth adds no runtime supply chain. PyJWT is here because the
# whole claim of that module is "CDP will accept this token", and the only
# way to check it without CDP is to have the reference implementation verify
# it. Without this line the cross-check importorskips and 22 tests pass by
# not running.
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "PyJWT>=2.8"]

[project.scripts]
lethe-notary = "lethe_notary.cli:cli"

[tool.setuptools.packages.find]
include = ["lethe_notary*"]
